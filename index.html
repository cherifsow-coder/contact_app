<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT -APP</title>
    <link rel="stylesheet" href="css/bootstrap.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h2>AJOUT-CONTACT</h2>
                    </div>
                    <div class="card-body">
                        <form id="contact-form">
                            <input type="hidden" id="id">
                         <div class="form-group">
                            <label for="prenom">prenom</label>
                            <input type="text" 
                            class="form-control" id="prenom"
                            name="prenom">
                         </div>
                         <div class="form-group">
                            <label for="nom">nom</label>
                            <input type="text" 
                            class="form-control" id="nom"
                            name="nom">
                         </div>
                         <div class="form-group">
                            <label for="Tel">Tel</label>
                            <input type="text" 
                            class="form-control" id="Tel"
                            name="Tel">
                         </div>
                          <div class="mt-2">
                            <button type="button" class="btn 
                            btn-success btn-sm" id="btn-ajout">Ajouter</button>
                          </div>
                       </form>
                 </div>
                    
                    
                </div>

            </div>
            <div class="col-md-8">
                <h2>Liste des contacts</h2>
                <div class="mb-3">
                    <input type="text" class="form-control" id="search" placeholder="Rechercher...">
                </div>
                <table class="table table-bordered table-hover">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>prenom</th>
                            <th>nom</th>
                            <th>Tel</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                    </tbody>
                </table>
                <div id="pagination" class="mt-3 d-flex justify-content-between align-items-center">
                    <button id="prev" class="btn btn-secondary">Précédent</button>
                    <span id="page-info">Page 1</span>
                    <button id="next" class="btn btn-secondary">Suivant</button>
                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
    
</body>
</html>
